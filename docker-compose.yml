version: "3.9"

services:

  mysql-db:
    image: mysql:8.0
    container_name: smart-clinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clinic1234
      MYSQL_DATABASE: cms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pclinic1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:7
    container_name: smart-clinic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: smart-clinic-app
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: clinic1234
      SPRING_DATA_MONGODB_URI: mongodb://mongo-db:27017/prescriptions
      JWT_SECRET: ${JWT_SECRET:-SmartClinicSuperSecretKeyForJWTSigning2024XYZ}

volumes:
  mysql_data:
  mongo_data:
