# setup instructions
# copy this file to application.properties and fill in your values
# application.properties is in .gitignore so it won't be committed

spring.application.name=smart-clinic

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB
# local: mongodb://localhost:27017/prescriptions
# with auth: mongodb://user:pass@localhost:27017/prescriptions?authSource=admin
# docker: mongodb://mongo-db:27017/prescriptions
spring.data.mongodb.uri=mongodb://localhost:27017/prescriptions

spring.web.resources.static-locations=classpath:/static/

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JWT secret key (must be at least 32 characters for HS256)
jwt.secret=SmartClinicSuperSecretKeyForJWTSigning2024XYZ

api.path=/api/
