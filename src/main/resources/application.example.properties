# ============================================================
#  Smart Clinic – Example Configuration
# ============================================================
#  1. Copy this file: cp application.example.properties application.properties
#  2. Fill in your values below
#  3. Never commit application.properties — it's in .gitignore
# ============================================================

spring.application.name=smart-clinic

# ── MySQL ────────────────────────────────────────────────────
# Local MySQL:  jdbc:mysql://localhost:3306/cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Docker setup: jdbc:mysql://mysql-db:3306/cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── MongoDB ──────────────────────────────────────────────────
# Local MongoDB:  mongodb://localhost:27017/prescriptions
# With auth:      mongodb://username:password@localhost:27017/prescriptions?authSource=admin
# Docker setup:   mongodb://mongo-db:27017/prescriptions
spring.data.mongodb.uri=mongodb://localhost:27017/prescriptions

# ── Static Files ─────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── JWT ──────────────────────────────────────────────────────
# Replace with a strong random secret (min 32 characters). Example:
# openssl rand -base64 32
jwt.secret=change-this-to-a-long-random-secret-before-running

# ── API Prefix ───────────────────────────────────────────────
api.path=/api/
