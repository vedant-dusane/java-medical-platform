<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Dashboard – Smart Clinic</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png" />
    <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />
    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
  </head>
  <body onload="renderContent()">
    <div class="container">
      <div class="wrapper">
        <!-- Header placeholder -->
        <div id="header"></div>

        <main class="main-content">
          <!-- Search bar -->
          <input
            type="text"
            id="searchBar"
            class="searchBar input-field"
            placeholder="Search Bar for custom output"
          />

          <!-- Filter dropdowns -->
          <div class="filter-wrapper">
            <select class="filter-select select-dropdown" id="filterTime">
              <option value="">Filter by Time</option>
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
            <select class="filter-select select-dropdown" id="filterSpecialty">
              <option value="">Filter by Specialty</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Dermatology">Dermatology</option>
              <option value="Neurology">Neurology</option>
              <option value="Orthopedics">Orthopedics</option>
              <option value="Pediatrics">Pediatrics</option>
              <option value="General">General</option>
            </select>
          </div>

          <!-- Dynamic doctor cards -->
          <div id="content"></div>
        </main>

        <!-- Footer placeholder -->
        <div id="footer"></div>
      </div>
    </div>

    <!-- Booking modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="../js/patientDashboard.js" defer></script>
  </body>
</html>
